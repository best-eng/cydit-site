<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cydit master mark</title>
  <desc id="desc">Approved Cydit C mark with a thought core and a lower-right exit.</desc>
  <defs>
    <!-- Approved palette: Signal Cyan → Primary Blue → Secondary Violet. -->
    <linearGradient id="ring" x1="135" y1="80" x2="388" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64E4FF"/>
      <stop offset="0.5" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#7861FF"/>
    </linearGradient>
    <radialGradient id="core" cx="34%" cy="24%" r="80%">
      <stop offset="0" stop-color="#64E4FF"/>
      <stop offset="0.52" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#7861FF"/>
    </radialGradient>
  </defs>

  <!--
    Master geometry. The circular C and exit are one continuous form:
    no arrowhead, no search glyph, no separate tail cap.
    Do not modify without a Brand Guide revision.
  -->
  <path
    d="M309 151 A139 139 0 1 0 309 361 L365 417"
    fill="none"
    stroke="url(#ring)"
    stroke-width="76"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="218" cy="256" r="52" fill="url(#core)"/>
</svg>
